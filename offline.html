<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>Offline - Henrique Bezerra</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a1a;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 25%, #0a0a1a 50%, #1a1a3a 75%, #0a0a1a 100%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2rem;
    }
    .logo span { color: #6366f1; }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
    }
    .icon svg { width: 100%; height: 100%; }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      color: #b0b0c0;
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .btn {
      padding: 0.75rem 2rem;
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background: rgba(30,30,60,0.8);
      transform: scale(1.1);
    }
    .lang-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: rgba(30,30,60,0.8);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ffffff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    .lang-toggle:hover { background: rgba(30,30,60,1); }
  </style>
</head>
<body>
  <button class="lang-toggle" id="langToggle" onclick="toggleLang()">EN</button>

  <div class="logo">Henrique <span>Bezerra</span></div>

  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
      <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/>
      <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/>
      <line x1="4.93" y1="19.07" x2="9.17" y2="14.83"/>
      <line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/>
    </svg>
  </div>

  <h1 id="title">Você está offline</h1>
  <p id="desc">Conecte-se à internet para acessar o portfólio.</p>

  <button class="btn" onclick="window.location.reload()" id="reloadBtn">Tentar novamente</button>

  <script>
    var isEN = false;
    var strings = {
      pt: {
        title: "Você está offline",
        desc: "Conecte-se à internet para acessar o portfólio.",
        btn: "Tentar novamente",
        lang: "EN"
      },
      en: {
        title: "You are offline",
        desc: "Connect to the internet to access the portfolio.",
        btn: "Try again",
        lang: "PT"
      }
    };
    function toggleLang() {
      isEN = !isEN;
      var s = isEN ? strings.en : strings.pt;
      document.getElementById("title").textContent = s.title;
      document.getElementById("desc").textContent = s.desc;
      document.getElementById("reloadBtn").textContent = s.btn;
      document.getElementById("langToggle").textContent = s.lang;
    }
    window.addEventListener("online", function() { window.location.reload(); });
  </script>
</body>
</html>
