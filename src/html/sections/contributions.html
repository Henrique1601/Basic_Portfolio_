<!-- CONTRIBUIÇÕES GITHUB -->
<section class="section__contributions scroll-section" id="contributions">
    <div class="title fade-in">
        <h2 data-translate="contributions_title">Atividade no GitHub</h2>
        <div class="line"></div>
    </div>

    <div class="contribution-graph fade-in card-glass">
        <div class="contribution-graph__title">
            <div class="contribution-graph__info">
                <h3 data-translate="contrib_subtitle">Atividade de contribuições</h3>
                <a href="https://github.com/Henrique1601" target="_blank" rel="noopener noreferrer" class="contribution-graph__user-link" aria-label="Perfil de Henrique no GitHub">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    @Henrique1601
                </a>
            </div>
            <div class="contribution-graph__stats">
                <div class="contribution-graph__stat">
                    <span class="contribution-graph__stat-number" id="totalContributions">648</span>
                    <span class="contribution-graph__stat-label" data-translate="contributions_year">contribuições no último ano</span>
                </div>
            </div>
        </div>
        <div class="contribution-graph__grid" id="contributionGrid"></div>
        <div class="contribution-graph__legend">
            <span data-translate="contrib_less">Menos</span>
            <div class="contribution-graph__legend-scale">
                <span style="background: var(--border-color)"></span>
                <span style="background: rgba(99, 102, 241, 0.3)"></span>
                <span style="background: rgba(99, 102, 241, 0.5)"></span>
                <span style="background: rgba(99, 102, 241, 0.7)"></span>
                <span style="background: var(--accent-color)"></span>
            </div>
            <span data-translate="contrib_more">Mais</span>
        </div>
    </div>
</section>
